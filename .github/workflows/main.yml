name: Parent Child JSON Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-parent:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read JSON variables
        id: config
        shell: powershell
        run: |
          $json = Get-Content "Config/values.json" -Raw | ConvertFrom-Json

          "a=$($json.a)" >> $env:GITHUB_OUTPUT
          "fruits=$($json.fruits)" >> $env:GITHUB_OUTPUT

      - name: Call child action
        uses: ./.github/action/AWC
        with:
          a: ${{ steps.config.outputs.a }}
          fruits: ${{ steps.config.outputs.fruits }}
