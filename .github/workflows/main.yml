name: Parent Child JSON Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-parent:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read JSON variables
        id: config
        shell: cmd
        run: python config\read_config.py
     

      - name: Call child action
        uses: ./.github/AWC
        with:
          a: ${{ steps.config.outputs.a }}
          fruits: ${{ steps.config.outputs.fruits }}