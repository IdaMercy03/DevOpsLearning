name: Parent Child YAML Pipeline
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
jobs:
  run-parent:
    runs-on: self-hosted
 
    env:
      A: 10
      FRUITS: apple,mango,orange
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Call child action
        uses: ./.github/AWC
        with:
          a: ${{ env.A }}
          fruits: ${{ env.FRUITS }}