
name: Python CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  run-python:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python in CMD
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python application in CMD
        shell: cmd
        run: python app.py
 