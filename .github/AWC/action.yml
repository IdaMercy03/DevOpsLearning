name: AWC Action
description: Receives parameters from parent workflow

inputs:
  a:
    description: Value of a
    required: true

  fruits:
    description: Fruit values
    required: true

runs:
  using: composite
  steps:
    - name: Print a using CMD
      shell: cmd
      env:
        A: ${{ inputs.a }}
      run: echo a = %A%

    - name: Print fruits using Python
      shell: cmd
      env:
        FRUITS: ${{ inputs.fruits }}
      run: python Folder\HelloWorld\hello.py