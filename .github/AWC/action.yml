name: AWC Action
description: Prints a and passes fruits to Python

inputs:
  a:
    description: Value of a
    required: true

  fruits:
    description: Fruit values
    required: true

runs:
  using: composite
  steps:
    - name: Print a
      shell: powershell
      env:
        A: ${{ inputs.a }}
      run: |
        Write-Host "a = $env:A"

    - name: Run Python
      shell: powershell
      env:
        FRUITS: ${{ inputs.fruits }}
      run: |
        python "Folder\HelloWorld\hello.py"