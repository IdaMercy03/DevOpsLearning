name: AWC Action
description: Receives JSON parameters and passes fruits to Python

inputs:
  a:
    description: Value of a from JSON
    required: true

  fruits:
    description: Fruits from JSON
    required: true

runs:
  using: composite
  steps:
    - name: Print a
      shell: powershell
      env:
        A: ${{ inputs.a }}
      run: |
        Write-Host "Child action output:"
        Write-Host "a = $env:A"

    - name: Run Python program
      shell: powershell
      env:
        FRUITS: ${{ inputs.fruits }}
      run: |
        python "HelloWorld\hello.py"
